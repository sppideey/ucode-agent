name: Feature request
description: Something ucode should do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: The task you were doing, and where ucode got in the way or fell short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
